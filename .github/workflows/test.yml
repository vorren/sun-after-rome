name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Lint source files
        run: |
          status=0
          for f in $(find src -name '*.fnl'); do
            echo "lint: $f"
            nix develop --command fennel --compile "$f" > /dev/null || status=1
          done
          for f in $(find test -name '*.fnl'); do
            echo "lint: $f"
            nix develop --command fennel --compile "$f" > /dev/null || status=1
          done
          exit $status

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Build
        run: nix develop --command make build

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Run tests
        run: nix develop --command make test

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
      - name: Build .love file
        run: nix build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sun-after-rome
          path: result/share/sun-after-rome.love
